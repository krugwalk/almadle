<style>
  :root{--bg:#0d0d12;--fg:#f4f4f5;--panel:#1c1c22;--line:#3a3a44;--ok:#43a047}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;color:var(--fg);
    font-family:system-ui,"Segoe UI","Segoe UI Emoji","Segoe UI Symbol","Noto Sans Math","Cambria Math",sans-serif}
  body{background:linear-gradient(120deg,#0d0d12,#1b1030,#10261f,#2a1410,#0d0d12);background-size:400% 400%;animation:bg 24s ease infinite}
  @keyframes bg{50%{background-position:100% 50%}}
  #hud{position:fixed;top:0;left:0;right:0;height:44px;z-index:99999;display:flex;align-items:center;gap:14px;padding:0 14px;
    background:#000c;backdrop-filter:blur(4px);border-bottom:1px solid var(--line);font-size:.9rem;white-space:nowrap;overflow:hidden}
  #hud h1{margin:0;font-size:1.25rem;letter-spacing:.06em;margin-right:auto;display:flex;align-items:center;gap:8px}
  #hud h1 img{width:32px;height:32px;border-radius:6px;object-fit:cover}
  .cat{width:150px;height:150px;border-radius:16px;object-fit:cover;display:block;margin:0 auto 10px;box-shadow:0 0 0 3px #0033ff,0 10px 30px #0033ff66}
  #end .cat{width:110px;height:110px}
  #desk{position:fixed;inset:44px 0 0 0;overflow:hidden}
  .win{position:absolute;width:min(340px,calc(100vw - 12px));max-height:calc(100vh - 56px);display:flex;flex-direction:column;
    background:var(--panel);border:2px solid hsl(var(--hue) 70% 55%);border-radius:10px;box-shadow:0 8px 30px #000a;
    animation:pop .28s cubic-bezier(.2,1.6,.4,1);overflow:hidden}
  .win.wander{transition:left 1s ease-in-out,top 1s ease-in-out}
  .win.jit{animation:pop .28s cubic-bezier(.2,1.6,.4,1),jit .25s infinite .3s}
  .win.solved{border-color:var(--ok);animation:solved .9s forwards}
  .win.nope{animation:shake .35s}
  @keyframes pop{from{transform:scale(.4);opacity:0}}
  @keyframes jit{25%{transform:translate(1px,-1px)}50%{transform:translate(-1px,1px)}75%{transform:translate(1px,1px)}}
  @keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  @keyframes solved{70%{opacity:1}to{opacity:0;transform:scale(.7)}}
  .tb{display:flex;align-items:center;gap:6px;padding:5px 8px;background:hsl(var(--hue) 70% 42%);cursor:grab;touch-action:none;user-select:none;font-weight:700;font-size:.85rem}
  .ttl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mc{font-weight:400;font-size:.75rem;opacity:.9}
  .x{border:0;background:#0004;color:#fff;border-radius:4px;width:22px;height:22px;cursor:pointer;line-height:1}
  .bd{padding:10px;overflow:auto;display:flex;flex-direction:column;gap:8px;align-items:center}
  .d{margin:0;font-size:.82rem;color:#c9c9d1;text-align:center}
  .b{background:#3b3b46;color:var(--fg);border:0;border-radius:6px;padding:7px 11px;font-size:.95rem;cursor:pointer;font-family:inherit}
  .b:hover{filter:brightness(1.2)} .b:active{filter:brightness(1.4)}
  .b.go{background:var(--ok);font-weight:700}
  .b.sym{font-size:1.2rem;min-width:40px}
  .b.sel{background:#1e88e5} .b:disabled{opacity:.3}
  .pal,.slots,.row{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
  .slot{user-select:none;width:36px;height:36px;border:2px solid #555;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:1.15rem}
  .hist{display:flex;flex-direction:column;gap:2px;max-height:110px;overflow:auto;width:100%;text-align:center;font-size:.95rem}
  input{background:#101015;color:var(--fg);border:2px solid #555;border-radius:6px;padding:6px 8px;font-size:1rem;width:90px;text-align:center;font-family:inherit}
  input[type=range]{width:150px;padding:0}
  .grid{display:grid;gap:4px}
  .cell{width:34px;height:34px;border:2px solid #555;border-radius:6px;background:#101015;color:var(--fg);cursor:pointer;font-size:1.1rem;padding:0;display:flex;align-items:center;justify-content:center;font-family:inherit}
  .cell.on{background:#fdd835;border-color:#fdd835}
  .pad{width:70px;height:56px;border:0;border-radius:10px;opacity:.55;cursor:pointer}
  .pad.lit{opacity:1;filter:brightness(1.4)}
  .area{position:relative;width:100%;height:170px;background:#101015;border:2px dashed #555;border-radius:8px;overflow:hidden}
  /* big invisible hitbox (76px) around the visible 46px target */
  .tgt{position:absolute;left:0;top:0;width:76px;height:76px;border:0;background:transparent;border-radius:50%;cursor:crosshair;padding:0;display:flex;align-items:center;justify-content:center}
  .tgt::before{content:"🎯";width:46px;height:46px;border-radius:50%;background:#e53935;display:flex;align-items:center;justify-content:center;font-size:1.5rem}
  .swatch{width:100px;height:46px;border-radius:6px;border:2px solid #fff4}
  .big{font-size:1.6rem;font-weight:700}
  /* overlays */
  .ov{position:fixed;inset:0;z-index:100000;background:#000d;display:flex;align-items:center;justify-content:center;padding:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;max-width:440px;text-align:center;line-height:1.5}
  .card h2{margin:0 0 8px;font-size:1.8rem;letter-spacing:.06em}
  #share{white-space:pre-wrap;background:#101015;border:1px solid var(--line);border-radius:10px;padding:12px 16px;display:inline-block;text-align:left;line-height:1.35;margin:10px 0}
  .btn{background:var(--ok);color:#fff;border:0;border-radius:999px;padding:11px 26px;font-size:1.05rem;cursor:pointer;font-weight:700;margin:4px}
  .btn.alt{background:#3b3b46}
  #next{color:#8a8a8e;font-size:.85rem;margin-top:8px}
</style>

function cyrb128(str){
  let h1=1779033703,h2=3144134277,h3=1013904242,h4=2773480762;
  for(let i=0;i<str.length;i++){const k=str.charCodeAt(i);
    h1=h2^Math.imul(h1^k,597399067);h2=h3^Math.imul(h2^k,2869860233);
    h3=h4^Math.imul(h3^k,951274213);h4=h1^Math.imul(h4^k,2716044179);}
  h1=Math.imul(h3^(h1>>>18),597399067);h2=Math.imul(h4^(h2>>>22),2869860233);
  h3=Math.imul(h1^(h3>>>17),951274213);h4=Math.imul(h2^(h4>>>19),2716044179);
  return (h1^h2^h3^h4)>>>0;
}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function mk(seed){
  const f = mulberry32(cyrb128(seed));

    shuffle:a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(f()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a} };
  return r;
}

function symInput(body, syms, L, onSubmit){
  let cur = []; const row=$e("div","slots"), pal=$e("div","pal");
  const draw = () => { row.innerHTML=""; for(let i=0;i<L;i++) row.append($e("span","slot", cur[i]!==undefined ? syms[cur[i]] : "·")); };
  const add = i => { if(cur.length<L){ cur.push(i); draw(); } }, del = () => { cur.pop(); draw(); },
        go = () => { if(cur.length===L){ const c=cur; cur=[]; draw(); onSubmit(c); } };
  syms.forEach((s,i) => pal.append(btn(s, () => add(i), "b sym")));
  pal.append(btn("⌫", del), btn("GO", go, "b go"));
  body.append(row, pal); draw();
  body.closest(".win")._key = e => {
    if(e.key==="Enter"){ go(); return true; } if(e.key==="Backspace"){ del(); return true; }
    const i = syms.indexOf(e.key); if(i>=0){ add(i); return true; } return false; };
}

});

/* ================= today's chaos schedule ================= */
const plan = mk("dingle::plan::" + today);
const N = plan.int(7, 10);
const ORDER = plan.shuffle(GAMES).slice(0, N);
const GAPS = ORDER.map((_,i)=> i===0 ? 0 : (i<3 ? plan.int(300,800) : plan.int(1000,3000)));
const SEEDWORDS = ["chaos","brainrot","skibidi","dingle","hemorrhage","cinema","123468","dj*"];

const missBy = ORDER.map(()=>0);
let started=false, spawned=0, solvedN=0, z=10, t0=0, timer, finished=false;
const fmt = s => `${Math.floor(s/60)}:${pad(Math.floor(s%60))}`;
const totalMiss = () => missBy.reduce((a,b)=>a+b,0);
function hud(){
  $("h-solved").textContent = `✅ ${solvedN}/${N}`;
  $("h-miss").textContent   = `❌ ${totalMiss()}`;
  $("h-open").textContent   = `${spawned-solvedN} open`;
}

function openGame(def, i){
  const r = mk(`${today}::g${i}`), desk = $("desk");
  const w=$e("div","win"), tb=$e("div","tb"), bd=$e("div","bd"), mc=$e("span","mc","");
  w.style.setProperty("--hue", r.int(0,359));
  if (r.f() < .25) w.classList.add("wander");
  const x=btn("×",()=>{ w.classList.remove("nope"); void w.offsetWidth; w.classList.add("nope"); },"x");
  tb.append($e("span","ttl",`${def.icon} ${def.name}`), mc, x);
  w.append(tb, bd); desk.append(w);
  const fx=r.f(), fy=r.f();
  w.style.left = Math.round(fx*Math.max(0, desk.clientWidth - w.offsetWidth)) + "px";
  w.style.top  = Math.round(fy*Math.max(0, desk.clientHeight - w.offsetHeight)) + "px";
  w.style.zIndex = ++z;
  let solved=false;
  const gm = { r, body:bd, alive:()=>w.isConnected && !solved,
    win(){ if(solved) return; solved=true; w.classList.add("solved"); solvedN++; hud();
      setTimeout(()=>{ w.remove(); hud(); check(); }, 880); },
    miss(){ if(solved) return; missBy[i]++; mc.textContent=`❌${missBy[i]}`; hud(); w.classList.remove("nope"); void w.offsetWidth; w.classList.add("nope"); } };
  try { def.build(gm); } catch(e){ console.error(def.name, e); gm.win(); }
  w.addEventListener("pointerdown", ()=>{ w.style.zIndex=++z; });
  tb.addEventListener("pointerdown", e=>{
    if(e.target===x) return; const wasWander=w.classList.contains("wander"); w.classList.remove("wander");
    const sx=e.clientX-w.offsetLeft, sy=e.clientY-w.offsetTop; tb.setPointerCapture(e.pointerId);
    tb.onpointermove=ev=>{ w.style.left=(ev.clientX-sx)+"px"; w.style.top=(ev.clientY-sy)+"px"; };
    tb.onpointerup=()=>{ tb.onpointermove=null; if(wasWander) w.classList.add("wander"); };
  });
  if (w.classList.contains("wander")){
    const hop=()=>{ if(!w.isConnected) return; if(w.classList.contains("wander") && !tb.onpointermove){
        w.style.left=Math.round(Math.random()*Math.max(0,desk.clientWidth-w.offsetWidth))+"px";
        w.style.top=Math.round(Math.random()*Math.max(0,desk.clientHeight-w.offsetHeight))+"px"; }
      setTimeout(hop, 4000+Math.random()*5000); };
    setTimeout(hop, 4000+Math.random()*4000);
  }
  spawned++; hud();
}

function spawnNext(i){
  if (i>=N || finished) return;
  setTimeout(()=>{ openGame(ORDER[i], i); spawnNext(i+1); }, i===0 ? 0 : GAPS[i]);
}
function check(){ if(!finished && spawned===N && solvedN===N) finish(); }

/* ================= results ================= */
const junk = n => { const r=mk("dingle::junk::"+today); return Array.from({length:n},()=>r.pick(JUNK)).join(""); };
function squares(miss){ const sq=miss.map(m=> m===0?"🟩" : m<=2?"🟨" : m<=5?"🟧" : "🟥"); const rows=[]; for(let i=0;i<sq.length;i+=5) rows.push(sq.slice(i,i+5).join("")); return rows.join("\n"); }
const SHARE_EMO = ["💀","😂","😭","🗿","🔥","‼️","🤡","🈸","🈂️","🔳","🔲","🐸","🦆","🍆","🧀","🥀","🫠","🤯","👁️","👄","👁️","🦷","🧠","🚽","🪳","🐒","🦐","🌚","⚰️","🛐","📉","📈","🎰","🧃","🍞","🥶","😈","🤓","🫃","💅","🙏","🗣️","🔊","❓","❗","⁉️","🆗","🆒","🈵","🉐","🈹","🅱️","🔞","♿","🚷","🔪","🩸","🧟","👽","🐛","🍄","🌭","🪦"];
function shareText(res){
  const fr=mk("almadle::share::"+today+"::"+res.miss.join(".")+"::"+res.t);
  const e=(a,b)=>Array.from({length:fr.int(a,b)},()=>fr.pick(SHARE_EMO)).join("");
  const j=n=>Array.from({length:n},()=>fr.pick(JUNK)).join("");
  const sq=squares(res.miss).split("\n").map(l=>l+(fr.f()<.6?e(1,2):"")).join("\n");
  const n=fr.pick(["123468","14","6","69","420","1337","𝟓𝟔𝟖"]);
  return `${e(1,2)}𝐀𝐥𝐦𝐚𝐝𝐥𝐞${e(0,1)} #${dayNo}:\n${sq}\n${e(1,2)}${j(4)}${e(1,2)};;;\n` +
    `dj*${e(1,1)}${n}${e(1,3)}\n${e(0,1)}${res.miss.length}${e(1,1)} · ${fmt(res.t)}${e(1,1)} · ❌${res.miss.reduce((a,b)=>a+b,0)} ${e(1,2)}\n\n` +
    `𝔹𝕣𝕠 𝕔𝕠𝕟𝕡𝕝𝕖𝕥𝕖𝕕 💀✅`;
}
const STORE = "dingle3:" + today;
function showEnd(res){
  $("share").textContent = shareText(res);
  $("start").style.display="none"; $("end").style.display="flex";
  const upd=()=>{ const t=new Date(), n=new Date(t.getFullYear(),t.getMonth(),t.getDate()+1)-t;
    $("next").textContent="Next Almadle (all new games) in "+[Math.floor(n/36e5),Math.floor(n/6e4)%60,Math.floor(n/1e3)%60].map(pad).join(":"); };
  upd(); setInterval(upd,1000);
}
function finish(){
  finished=true; clearInterval(timer);
  const res={ t:Math.round((performance.now()-t0)/1000), miss:missBy.slice() };
  try{ localStorage.setItem(STORE, JSON.stringify(res)); }catch(e){}

const FONTS = { bold:[0x1D400,0x1D41A,0x1D7CE], bit:[0x1D468,0x1D482,0], scr:[0x1D4D0,0x1D4EA,0], frak:[0x1D56C,0x1D586,0],
  dbl:[0x1D538,0x1D552,0x1D7D8], sans:[0x1D5D4,0x1D5EE,0x1D7EC], mono:[0x1D670,0x1D68A,0x1D7F6], full:[0xFF21,0xFF41,0xFF10], small:0, circ:0, plain:0 };
const DBL_HOLES = {C:"ℂ",H:"ℍ",N:"ℕ",P:"ℙ",Q:"ℚ",R:"ℝ",Z:"ℤ"}, SMALL = "ᴀʙᴄᴅᴇꜰɢʜɪᴊᴋʟᴍɴᴏᴘǫʀsᴛᴜᴠᴡxʏᴢ";
function fontify(s, f){
  return [...s].map(ch => { const c = ch.codePointAt(0), up = c>=65&&c<=90, lo = c>=97&&c<=122, dg = c>=48&&c<=57;
    if (f==="plain") return ch;
    if (f==="small") return lo ? SMALL[c-97] : ch;
    if (f==="circ") return up ? String.fromCodePoint(0x24B6+c-65) : lo ? String.fromCodePoint(0x24D0+c-97) : c===48 ? "⓪" : dg ? String.fromCodePoint(0x2460+c-49) : ch;
    const [A,a,d] = FONTS[f];
    if (up) return (f==="dbl" && DBL_HOLES[ch]) || String.fromCodePoint(A+c-65);
    if (lo) return String.fromCodePoint(a+c-97);
    if (dg && d) return String.fromCodePoint(d+c-48);
    return ch; }).join("");
}

/* ---- recolor the cat with a random two-gradient paint job each day ---- */
(function catOfTheDay(){
  const cr = mk("almadle::cat::" + today), src = document.querySelector("img.cat").src;
  // one random color for the background; the cat stays white. Any RGB except too-close-to-white.
  let col; do { col=[cr.int(0,255),cr.int(0,255),cr.int(0,255)]; } while (0.299*col[0]+0.587*col[1]+0.114*col[2] > 185);
  const img = new Image();
  img.onload = () => {
    const S=256, c=document.createElement("canvas"); c.width=c.height=S; const x=c.getContext("2d");
    x.drawImage(img,0,0,S,S); const d=x.getImageData(0,0,S,S), p=d.data;
    for(let i=0;i<p.length;i+=4){
      const t=clamp(1-(p[i]+p[i+1])/510,0,1);                                             // 1 = blue ink, 0 = white
      for(let k=0;k<3;k++) p[i+k]=255+(col[k]-255)*t;
    }
    x.putImageData(d,0,0); const url=c.toDataURL("image/png");
    document.querySelectorAll("img").forEach(im=>{ if(im.src===src) im.src=url; });
    const ic=document.querySelector("link[rel=icon]"); if(ic) ic.href=url;
    document.querySelectorAll(".cat").forEach(im=>im.style.boxShadow=`0 0 0 3px rgb(${col}),0 10px 30px rgb(${col.join(" ")} / .5)`);
  };
  img.src = src;
})();
