<style>
:root{--bg:#0d0d12;--fg:#f4f4f5;--panel:#1c1c22;--line:#3a3a44;--ok:#43a047}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;color:var(--fg);
font-family:system-ui,"Segoe UI","Segoe UI Emoji","Segoe UI Symbol","Noto Sans Math","Cambria Math",sans-serif}
body{background:linear-gradient(120deg,#0d0d12,#1b1030,#10261f,#2a1410,#0d0d12);background-size:400% 400%;animation:bg 24s ease infinite}
@keyframes bg{50%{background-position:100% 50%}}
#hud{position:fixed;top:0;left:0;right:0;height:44px;z-index:99999;display:flex;align-items:center;gap:14px;padding:0 14px;
background:#000c;backdrop-filter:blur(4px);border-bottom:1px solid var(--line);font-size:.9rem;white-space:nowrap;overflow:hidden}
#hud h1{margin:0;font-size:1.25rem;letter-spacing:.06em;margin-right:auto;display:flex;align-items:center;gap:8px}
#hud h1 img{width:32px;height:32px;border-radius:6px;object-fit:cover}
.cat{width:150px;height:150px;border-radius:0;object-fit:cover;display:block;margin:0 auto 10px;box-shadow:none!important}
#end .cat{width:110px;height:110px}
.cat,#hud h1 img{outline:2px solid #000}
#hud h1 img{outline-width:1px}
#start .card{min-width:min(380px,92vw)}
#intro{font-family:'Cambria Math','STIX Two Math','Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',serif}
#desk{position:fixed;inset:44px 0 0 0;overflow:hidden}
.win{color:var(--fg);position:absolute;width:min(340px,calc(100vw - 12px));max-height:calc(100vh - 56px);max-height:calc(100dvh - 56px);display:flex;flex-direction:column;
background:var(--panel);border:2px solid hsl(var(--hue) 70% 55%);border-radius:10px;box-shadow:0 8px 30px #000a;
animation:pop .28s cubic-bezier(.2,1.6,.4,1);overflow:hidden}
.win.wander{transition:left 1s ease-in-out,top 1s ease-in-out}
.win.jit{animation:pop .28s cubic-bezier(.2,1.6,.4,1),jit .25s infinite .3s}
.win.solved{border-color:var(--ok);animation:solved .9s forwards}
.win.nope{animation:shake .35s}
@keyframes pop{from{transform:scale(.4);opacity:0}}
@keyframes jit{25%{transform:translate(1px,-1px)}50%{transform:translate(-1px,1px)}75%{transform:translate(1px,1px)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes solved{70%{opacity:1}to{opacity:0;transform:scale(.7)}}
.tb{display:flex;align-items:center;gap:6px;padding:5px 8px;background:hsl(var(--hue) 70% 42%);cursor:grab;touch-action:none;user-select:none;font-weight:700;font-size:.85rem}
.ttl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mc{font-weight:400;font-size:.75rem;opacity:.9}
.x{border:0;background:#0004;color:#fff;border-radius:4px;width:22px;height:22px;cursor:pointer;line-height:1}
.bd{padding:10px;overflow:auto;display:flex;flex-direction:column;gap:8px;align-items:center}
.d{margin:0;font-size:.82rem;color:#c9c9d1;text-align:center}
.b{background:#3b3b46;color:var(--fg);border:0;border-radius:6px;padding:7px 11px;font-size:.95rem;cursor:pointer;font-family:inherit}
.b:hover{filter:brightness(1.2)} .b:active{filter:brightness(1.4)}
.b.go{background:var(--ok);font-weight:700}
.b.sym{font-size:1.2rem;min-width:40px}
.b.sel{background:#1e88e5} .b:disabled{opacity:.3}
.pal,.slots,.row{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.slot{user-select:none;width:36px;height:36px;border:2px solid #555;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:1.15rem}
.hist{display:flex;flex-direction:column;gap:2px;max-height:110px;overflow:auto;width:100%;text-align:center;font-size:.95rem}
input{background:#101015;color:var(--fg);border:2px solid #555;border-radius:6px;padding:6px 8px;font-size:1rem;width:90px;text-align:center;font-family:inherit}
input[type=range]{width:150px;padding:0}
.grid{display:grid;gap:4px}
.cell{width:34px;height:34px;border:2px solid #555;border-radius:6px;background:#101015;color:var(--fg);cursor:pointer;font-size:1.1rem;padding:0;display:flex;align-items:center;justify-content:center;font-family:inherit}
.cell.on{background:#fdd835;border-color:#fdd835}
.pad{width:70px;height:56px;border:0;border-radius:10px;opacity:.55;cursor:pointer}
.pad.lit{opacity:1;filter:brightness(1.4)}
.area{position:relative;width:100%;height:170px;background:#101015;border:2px dashed #555;border-radius:8px;overflow:hidden}
.tgt{position:absolute;left:0;top:0;width:76px;height:76px;border:0;background:transparent;border-radius:50%;cursor:crosshair;padding:0;display:flex;align-items:center;justify-content:center}
.tgt::before{content:"🎯";width:46px;height:46px;border-radius:50%;background:#e53935;display:flex;align-items:center;justify-content:center;font-size:1.5rem}
.swatch{width:100px;height:46px;border-radius:6px;border:2px solid #fff4}
.big{font-size:1.6rem;font-weight:700}
.ov{position:fixed;inset:44px 0 0 0;z-index:100000;background:#0006;display:flex;align-items:safe center;justify-content:center;padding:16px;overflow:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;max-width:440px;text-align:center;line-height:1.5}
.card h2{margin:0 0 8px;font-size:1.8rem;letter-spacing:.06em}
#share{white-space:pre-wrap;background:#101015;border:1px solid var(--line);border-radius:10px;padding:12px 16px;display:inline-block;text-align:left;line-height:1.35;margin:10px 0}
.btn{background:var(--ok);color:#fff;border:0;border-radius:999px;padding:11px 26px;font-size:1.05rem;cursor:pointer;font-weight:700;margin:4px}
.btn.alt{background:#3b3b46}
#next{color:inherit;opacity:.65;font-size:.85rem;margin-top:8px}
#stats{min-height:calc(100dvh - 300px);display:flex;flex-direction:column;justify-content:center;gap:14px;margin:6px 0 10px;text-transform:none!important}
#stats *{text-transform:none!important}
.st-score{font-size:2.4rem;font-weight:900;line-height:1}
.rl{display:flex;flex-direction:column;gap:6px;padding:10px 12px;background:#fff;color:#000}
.rl-top{font-size:.9rem}
.fling{position:relative;height:118px;margin-top:14px;overflow:hidden}
.fl-field{position:absolute;left:38px;right:8px;top:0;bottom:4px;border-bottom:2px solid #000}
.fl-dot{position:absolute;bottom:0;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:rgba(70,70,70,.55)}
.fl-sling{position:absolute;left:6px;bottom:5px;width:26px;height:46px;overflow:visible}
.fl-alma{position:absolute;left:0;bottom:0;will-change:transform;z-index:2}
.fl-you{position:absolute;bottom:0;z-index:3;white-space:nowrap;font-size:.7rem;font-weight:700;background:#2e9e4f;color:#fff;padding:2px 7px;border-radius:9px;opacity:0;transition:opacity .25s}
.fl-you.on{opacity:1}
.fl-me{position:absolute;bottom:5px;width:11px;height:11px;margin-left:-5.5px;border-radius:50%;background:#2e9e4f;box-shadow:0 0 0 2px #fff;z-index:3;transform:scale(0);transition:transform .25s cubic-bezier(.3,1.8,.5,1)}
.fl-stem{position:absolute;bottom:14px;width:3px;margin-left:-1.5px;height:0;background:#2e9e4f;z-index:2;transition:height .25s ease-out .12s}
.fling.landed .fl-me{transform:scale(1)} .fling.landed .fl-stem{height:24px}
.fl-you small{font-weight:600;opacity:.9;margin-left:4px}
.fl-axis{position:relative;height:16px;margin:2px 8px 0 38px;font-size:.7rem;opacity:.7}
.fl-axis span{position:absolute;top:0;transform:translateX(-50%)}
.fl-axis span::before{content:"";position:absolute;left:50%;top:-6px;width:1px;height:4px;background:#000}
#h-top{background:none;border:0;padding:0;cursor:pointer;display:flex;align-items:center}
#h-top[hidden]{display:none}
.topov{position:fixed;inset:0;z-index:200000;background:#0009;display:flex;align-items:center;justify-content:center;padding:16px}
.topcard{position:relative;background:#c0c0c0;color:#000;width:min(340px,100%);padding:16px 14px 14px;display:flex;flex-direction:column;gap:8px;text-align:center}
.topx{position:absolute;top:4px;right:6px;background:none;border:0;font-size:1.3rem;line-height:1;cursor:pointer;color:#000}
.topcard .t5-row.me{background:#fff}
.topcard .btn{background:#000!important;color:#fff!important;border:0!important;border-radius:0!important;box-shadow:none!important;text-shadow:none!important;font-family:inherit}
.topcard,.topcard *{font-family:ui-monospace,"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace!important;text-transform:none!important}
.topcard{font-weight:600}
.t5{display:flex;flex-direction:column;gap:3px}
.t5-row{display:grid;grid-template-columns:28px 1fr auto 40px;align-items:center;gap:10px;padding:5px 8px;font-size:15px;line-height:1.2;text-align:left}
.t5-row.me{background:#fff;font-weight:800}
.t5-rank{width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:#a8a8a8;color:#000}
.t5-row.p1 .t5-rank{background:#ffd400} .t5-row.p2 .t5-rank{background:#e6e6e6} .t5-row.p3 .t5-rank{background:#d8955a}
.t5-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t5-time{font-variant-numeric:tabular-nums;text-align:right}
.t5-miss{color:#b3261e;font-size:13px;font-weight:700;text-align:right}
.t5-empty{font-size:14px;padding:6px;opacity:.7}
.t5-ask{font-size:.8rem;margin-top:6px}
.t5-tabs{display:flex;justify-content:center;gap:4px;margin:0 28px 6px}
.t5-tab{flex:1;background:#a8a8a8;color:#000;border:0;padding:6px 0;font-size:13px;font-weight:700;letter-spacing:.12em;cursor:pointer}
.t5-tab.on{background:#000;color:#fff}
.t5-sep{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase!important;opacity:.75;margin-top:6px;border-top:1px dashed #0006;padding-top:10px}
.t5-sep.t5-first{border-top:0;margin-top:0;padding-top:0}
.t5-form{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.t5-form input{font:inherit;font-size:16px;padding:6px 8px;border:2px solid #000;border-radius:0;width:150px;background:#fff;color:#000}
.t5-form .btn{padding:6px 12px}
.t5-err{font-size:.7rem;opacity:.7;min-height:1em}
.st-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.st-tile{display:flex;flex-direction:column;align-items:center;gap:2px}
.st-v{font-size:1.6rem;font-weight:700;line-height:1.1}
.st-l{font-size:.68rem;line-height:1.2;opacity:.75}
.st-h{font-size:.85rem;font-weight:700;letter-spacing:.04em}
.st-bars{display:flex;flex-direction:column;gap:4px;text-align:left}
.st-row{display:flex;align-items:center;gap:6px;font-size:.85rem}
.st-row b{width:28px;text-align:center;flex:none}
.st-bar{background:#555;color:#fff;padding:1px 6px;text-align:right;min-width:22px;font-weight:700}
.st-bar.hi{background:#2e9e4f}
.st-foot{font-size:.8rem;opacity:.8}
@media (max-width:420px){ .st-tiles{grid-template-columns:repeat(2,1fr);row-gap:12px} .st-v{font-size:1.4rem} }
.st-down{opacity:.5;font-size:1.2rem;animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(5px)}}
.sk-dark .b.go{background:hsl(calc(var(--hue) + 150) 65% 40%)}

.site-brutal #hud{background:#fff;color:#000;border-bottom:4px solid #000;text-transform:uppercase}
.site-brutal .card{background:#fff;color:#000;border:4px solid #000;border-radius:0;box-shadow:12px 12px 0 #000}
.site-brutal .btn{background:hsl(calc(var(--hue) + 150) 100% 60%);color:#000;border:3px solid #000;border-radius:0;box-shadow:5px 5px 0 #000}
.site-brutal #share{background:#fff;color:#000;border:3px solid #000;border-radius:0}
.site-pixel{background:#222034 radial-gradient(#ffffff22 1px,transparent 1px) 0 0/8px 8px;font-family:"Courier New",monospace}
.site-pixel #hud{background:#000;color:#fff;border-bottom:4px solid #fff}
.site-pixel .card{background:#222034;color:#fff;border:0;border-radius:0;box-shadow:0 -4px 0 #fff,0 4px 0 #fff,-4px 0 0 #fff,4px 0 0 #fff}
.site-pixel .btn{background:#6abe30;border-radius:0;box-shadow:inset -4px -4px 0 #0006;font-family:inherit}
.site-pixel #share{background:#000;color:#fff;border:3px solid #fff;border-radius:0}
.site-paper{background:#c89f6a radial-gradient(#0002 1px,transparent 1px) 0 0/6px 6px;font-family:"Segoe Print","Comic Sans MS",cursive}
.site-paper #hud{background:#fffdf3;color:#1b2a6b;border-bottom:2px solid #e8a3a3}
.site-paper .card{background:#fffdf3 repeating-linear-gradient(transparent 0 27px,#a7c7e7 27px 28px);color:#1b2a6b;border:0;border-radius:2px;box-shadow:0 8px 20px #0006}
.site-paper .btn{background:#ffe066;color:#1b2a6b;border:2px solid #1b2a6b;border-radius:255px 15px 225px 15px/15px 225px 15px 255px;font-family:inherit}
.site-paper #share{background:#fff8;color:#1b2a6b;border:2px dashed #1b2a6b}
.site-neon{background:#05000d linear-gradient(hsl(var(--hue) 100% 60% / .12) 1px,transparent 1px) 0 0/100% 32px}
.site-neon #hud{background:#05000dcc;color:hsl(var(--hue) 100% 70%);border-bottom:1px solid hsl(var(--hue) 100% 60%);text-shadow:0 0 8px currentColor}
.site-neon .card{background:#0a0014;color:#fff;border:2px solid hsl(var(--hue) 100% 62%);box-shadow:0 0 30px hsl(var(--hue) 100% 55% / .6)}
.site-neon .btn{background:transparent;color:hsl(calc(var(--hue) + 120) 100% 70%);border:2px solid currentColor;box-shadow:0 0 12px currentColor}
.site-neon #share{background:#000;color:#fff;border-color:hsl(var(--hue) 100% 62%)}
.site-gb{background:#5c5c6c;font-family:"Courier New",monospace}
.site-gb #hud{background:#8b8b9b;color:#2d1b69;border:0}
.site-gb .card{background:#9bbc0f;color:#0f380f;border:8px solid #8b8b9b;border-radius:12px 12px 48px 12px}
.site-gb .btn{background:#a01050;border-radius:999px}
.site-gb #share{background:#8bac0f;color:#0f380f;border:2px solid #306230;border-radius:0}
.site-post{background:#b98b57 radial-gradient(#0002 2px,transparent 2px) 0 0/10px 10px;font-family:"Comic Sans MS","Segoe Print",cursive}
.site-post #hud{background:hsl(var(--hue) 95% 80%);color:#222;border:0}
.site-post .card{background:hsl(var(--hue) 95% 80%);color:#222;border:0;border-radius:0 0 30px 0;transform:rotate(-1.5deg);box-shadow:6px 12px 22px #0007}
.site-post .btn{background:#222;color:hsl(var(--hue) 95% 80%);border-radius:4px}
.site-post #share{background:#fff8;color:#222;border:1px dashed #0006}
.site-kawaii{background:#ffd6ea radial-gradient(#fff 2px,transparent 2px) 0 0/18px 18px;font-family:"Comic Sans MS","Segoe UI",sans-serif}
.site-kawaii #hud{background:repeating-linear-gradient(45deg,#ffb6d9 0 10px,#ffc9e3 10px 20px);color:#b0306a;border:0}
.site-kawaii .card{background:#ffe4f1;color:#b0306a;border:3px dashed #ff8fc7;border-radius:30px}
.site-kawaii .btn{background:#ff5aa5;border-radius:20px}
.site-kawaii #share{background:#fff;color:#b0306a;border:2px dotted #ff8fc7;border-radius:18px}
.site-chrome{background:linear-gradient(135deg,#dfe6ef,#8796ad 45%,#e8edf3 55%,#6d7d96);font-family:"Trebuchet MS",sans-serif}
.site-chrome #hud{background:linear-gradient(#dfe7f2,#9fb0c8 50%,#8496b2 51%,#c9d5e6);color:#0d1b33;border-bottom:1px solid #6d7d96}
.site-chrome .card{background:linear-gradient(135deg,#f5f7fa,#c3cfe2 40%,#e9eef5 60%,#a7b4c9);color:#1a2a44;border:2px solid #7d8ca3;border-radius:28px 6px 28px 6px}
.site-chrome .btn{background:linear-gradient(hsl(var(--hue) 90% 80%),hsl(var(--hue) 80% 50%) 50%,hsl(var(--hue) 80% 42%) 51%,hsl(var(--hue) 90% 65%));border:1px solid #6d7d96;border-radius:14px}
.site-chrome #share{background:#fff9;color:#1a2a44;border-color:#6d7d96}
body .ov .card{background:#c0c0c0!important;color:#000!important;border:0!important;border-radius:0!important;
box-shadow:none!important;backdrop-filter:none!important;transform:none!important}
body .ov .btn{background:#000!important;color:#fff!important;border:0!important;border-radius:0!important;box-shadow:none!important;text-shadow:none!important;font-family:inherit}
body .ov #share{background:#fff!important;color:#000!important;border:0!important;border-radius:0!important}
body #hud{background:#c0c0c0!important;color:#000!important;border:0!important;border-bottom:2px solid #000!important;border-radius:0!important;
left:0!important;right:0!important;top:0!important;box-shadow:none!important;backdrop-filter:none!important;text-transform:none!important}
#hud h1 img{border-radius:0!important}
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%}
button,.win,.area,.cell,.pad{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#share{-webkit-user-select:text;user-select:text}
.lights .cell{background:#16161c!important;border-color:#3a3a44!important;box-shadow:none!important}
.lights .cell.on{background:#ffd400!important;border-color:#fff3a0!important}
html body{background:#5c5c6c!important;animation:none!important}
@supports not selector(::-webkit-scrollbar){*{scrollbar-color:#c0c0c0 #2a2a33}}
::-webkit-scrollbar{width:12px;height:12px;background:#2a2a33}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:#2a2a33}
::-webkit-scrollbar-thumb{background:#c0c0c0;border:0;border-radius:0}
::-webkit-scrollbar-button{display:none}
.ttl{text-transform:lowercase!important}
body *{text-transform:lowercase!important}
#share,#share *,#intro,#intro *,.card h2{text-transform:none!important}
*,*::before,*::after{text-shadow:none!important}
.sk-neon,.sk-neon .b,.sk-neon .cell,.sk-neon .b.go,.sk-term,.sk-blob,.sk-aero{box-shadow:none!important}
</style>
